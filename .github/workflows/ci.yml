name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated behavioral tests
        run: python -B -m unittest discover -s tests -v
      - name: Check script syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in [*Path('scripts').glob('*.py'), *Path('tests').glob('*.py')]:
              ast.parse(path.read_text(), filename=str(path))
          PY
      - name: Audit the published repository
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          result = subprocess.run([sys.executable, 'scripts/repo_steward.py', 'audit', '--root', '.', '--json'], check=True, capture_output=True, text=True)
          report = json.loads(result.stdout)
          assert report['complete'], report
          assert not report['findings'], report['findings']
          PY
